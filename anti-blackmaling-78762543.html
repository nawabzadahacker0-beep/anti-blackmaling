<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nawab Zada Hacker  Admin Panel</title>
    <meta name="robots" content="noindex, nofollow, noarchive">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#070b13',
                            card: '#0e1626',
                            border: '#1b2a47',
                            cyan: '#00f3ff',
                            red: '#ff2a5f',
                            green: '#00ff88',
                            purple: '#9d4edd',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cyber-dark text-slate-200 min-h-screen p-4 sm:p-6 select-none">

    <div class="max-w-7xl mx-auto space-y-6">

        <div id="adminAuthBox" class="max-w-md mx-auto bg-cyber-card border border-cyber-border rounded-2xl p-8 text-center space-y-4 my-20 shadow-2xl shadow-red-950/40">
            <div class="w-20 h-20 mx-auto bg-cyber-red/10 rounded-full flex items-center justify-center border border-cyber-red/30">
                <i class="fa-solid fa-user-shield text-4xl text-cyber-red"></i>
            </div>
            <h2 class="text-2xl font-black text-white uppercase tracking-wider">Secure Cyber Vault</h2>
            <p class="text-xs text-gray-400">Enter your master terminal PIN to authorize dashboard.</p>
            <input type="password" id="adminPin" placeholder="MASTER PIN" class="w-full bg-cyber-dark border border-cyber-border rounded-xl px-4 py-3 text-center text-white text-lg tracking-widest focus:outline-none focus:border-cyber-red">
            <button onclick="authAdmin()" class="w-full py-3 bg-cyber-red hover:bg-red-600 font-bold text-white rounded-xl shadow-lg transition">
                <i class="fa-solid fa-unlock-keyhole mr-2"></i> Unlock Terminal
            </button>
        </div>

        <div id="adminDashboard" class="hidden space-y-6">
            
            <div class="flex flex-wrap items-center justify-between gap-4 border-b border-cyber-border pb-6">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-black text-white flex items-center gap-2">
                        <i class="fa-solid fa-terminal text-cyber-cyan"></i> Nawab Zada Control Room
                    </h1>
                    <p class="text-xs text-cyber-cyan font-mono mt-1">Status: <span class="text-cyber-green font-bold">Encrypted & Online</span></p>
                </div>

                <div class="flex flex-wrap gap-2">
                    <button onclick="filterAdmin('All')" class="px-3.5 py-1.5 rounded-lg text-xs bg-cyber-card border border-cyber-border hover:border-cyber-cyan transition font-bold text-white">All Reports</button>
                    <button onclick="filterAdmin('Blackmailing')" class="px-3.5 py-1.5 rounded-lg text-xs bg-cyber-card border border-cyber-red text-cyber-red font-bold">Blackmailing</button>
                    <button onclick="filterAdmin('Scam')" class="px-3.5 py-1.5 rounded-lg text-xs bg-cyber-card border border-yellow-400 text-yellow-400 font-bold">Scams</button>
                    <button onclick="filterAdmin('Order')" class="px-3.5 py-1.5 rounded-lg text-xs bg-cyber-card border border-cyber-cyan text-cyber-cyan font-bold">Orders</button>
                    <button onclick="filterAdmin('Other')" class="px-3.5 py-1.5 rounded-lg text-xs bg-cyber-card border border-cyber-purple text-cyber-purple font-bold">Other</button>
                    <button onclick="filterAdmin('ChatReq')" class="px-3.5 py-1.5 rounded-lg text-xs bg-cyber-card border border-pink-500 text-pink-400 font-bold relative">
                        <i class="fa-solid fa-comments mr-1"></i> Live Chat Requests
                    </button>
                    <a href="index.html" class="px-3.5 py-1.5 rounded-lg text-xs bg-gray-800 text-gray-300 hover:text-white font-bold"><i class="fa-solid fa-arrow-left mr-1"></i> Public Site</a>
                </div>
            </div>

            <div id="adminReportsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
        </div>

    </div>

    <div id="docPreviewModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cyber-card border border-cyber-border rounded-2xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-4 border-b border-cyber-border bg-cyber-dark">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-file-shield text-cyber-cyan"></i> Document / Proof Preview
                </h3>
                <button onclick="closeDocPreview()" class="text-gray-400 hover:text-cyber-red text-lg font-bold">&times;</button>
            </div>
            <div id="docPreviewBody" class="p-4 overflow-auto flex items-center justify-center flex-1 bg-black/40">
            </div>
            <div class="p-3 border-t border-cyber-border bg-cyber-dark flex justify-end gap-2">
                <a id="docDownloadBtn" href="#" target="_blank" download class="px-4 py-1.5 bg-cyber-cyan/20 border border-cyber-cyan text-cyber-cyan text-xs font-bold rounded-lg hover:bg-cyber-cyan hover:text-black transition">Download Attachment</a>
                <button onclick="closeDocPreview()" class="px-4 py-1.5 bg-gray-700 text-xs font-bold text-white rounded-lg">Close</button>
            </div>
        </div>
    </div>

    <div id="liveChatModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cyber-card border border-cyber-cyan/50 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl flex flex-col h-[85vh]">
            <div class="flex justify-between items-center p-4 border-b border-cyber-border bg-cyber-dark">
                <div>
                    <h3 id="chatTargetName" class="text-sm font-bold text-white">Encrypted Chat</h3>
                    <p id="chatTargetDetails" class="text-[11px] text-gray-400 font-mono"></p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="blockChatBtn" onclick="blockCurrentChat()" class="px-3 py-1 bg-red-600/20 border border-red-500 text-red-400 text-xs font-bold rounded-lg hover:bg-red-600 hover:text-white transition">
                        <i class="fa-solid fa-ban mr-1"></i> Block User
                    </button>
                    <button onclick="closeLiveChatModal()" class="text-gray-400 hover:text-white text-lg font-bold ml-2">&times;</button>
                </div>
            </div>

            <div id="chatMessagesBox" class="flex-1 overflow-y-auto p-4 space-y-3 bg-cyber-dark/60 font-mono text-xs">
            </div>

            <form onsubmit="sendAdminMessage(event)" class="p-3 border-t border-cyber-border bg-cyber-dark flex gap-2">
                <input type="text" id="adminMsgInput" placeholder="Type message to client..." autocomplete="off" class="flex-1 bg-cyber-card border border-cyber-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-cyber-cyan">
                <button type="submit" class="px-5 py-2.5 bg-cyber-cyan text-black font-bold text-xs rounded-xl hover:bg-cyan-400 transition flex items-center gap-1">
                    Send <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-database.js"></script>
    
    <script src="js/nz-core-sec-99x.js"></script>
</body>
</html>
